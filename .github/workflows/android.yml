name: Compilar e publicar APK

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Instalar SDK Android
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Preparar arquivos do jogo
        run: mkdir -p android/app/src/main/assets/www && cp index.html android/app/src/main/assets/www/index.html
      - name: Compilar APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - name: Publicar APK na Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.0 android/app/build/outputs/apk/debug/app-debug.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Nerdverso para Android" \
            --notes "Instalador Android do Nerdverso. Baixe app-debug.apk e abra no seu aparelho." \
            --latest || gh release upload v1.0.0 android/app/build/outputs/apk/debug/app-debug.apk \
            --repo "$GITHUB_REPOSITORY" --clobber
