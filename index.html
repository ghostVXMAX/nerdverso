<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#101022" />
  <meta name="description" content="Um quiz de adivinhações do universo nerd: anime, música, séries, filmes, mangá e games." />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <title>Quem é? — Quiz do Universo Nerd</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap');
    :root{color-scheme:dark;--bg:#101022;--panel:#19192e;--muted:#a7a6bc;--ink:#f6f3ff;--purple:#a78bfa;--lime:#c6f36b;--pink:#ff83b6}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font-family:'Space Grotesk',sans-serif;background:radial-gradient(ellipse at 50% -20%,#39305f 0,transparent 50%),var(--bg);overflow-x:hidden}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.23;background-image:radial-gradient(#fff 1px,transparent 1px);background-size:44px 44px;mask-image:linear-gradient(to bottom,#000,transparent 85%)}
    .wrap{position:relative;max-width:1050px;padding:28px 24px 56px;margin:auto}.top{display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.04em}.brand-mark{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;background:var(--lime);color:#19192e;font-size:20px;transform:rotate(-8deg)}.brand span:last-child{font-size:17px}.top-note{font:11px 'DM Mono',monospace;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}.hero{text-align:center;padding:51px 0 30px}.eyebrow{color:var(--lime);font:11px 'DM Mono',monospace;letter-spacing:.18em;text-transform:uppercase}.hero h1{font-size:clamp(42px,8vw,76px);line-height:.97;letter-spacing:-.075em;margin:14px 0 13px}.hero h1 em{font-style:normal;color:var(--purple)}.hero p{color:var(--muted);margin:0;font-size:15px}
    .categories{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin:0 auto 24px}.cat{border:1px solid #34334c;color:#c3c1d4;background:#171729;padding:9px 14px;border-radius:30px;font:12px 'DM Mono',monospace;cursor:pointer;transition:.18s}.cat:hover{border-color:#8880b0;color:white;transform:translateY(-1px)}.cat.active{background:var(--lime);border-color:var(--lime);color:#171729;font-weight:500}
    .game{max-width:700px;margin:auto;border:1px solid #37354f;border-radius:22px;background:linear-gradient(145deg,rgba(31,30,53,.97),rgba(21,21,38,.98));box-shadow:0 24px 90px #08081080;overflow:hidden}.game-head{padding:18px 23px;border-bottom:1px solid #35334b;display:flex;align-items:center;justify-content:space-between}.round{font:11px 'DM Mono',monospace;color:var(--muted);letter-spacing:.1em}.round b{color:white}.score{display:flex;align-items:center;gap:8px;background:#27263e;padding:7px 11px;border-radius:9px;font:12px 'DM Mono',monospace}.score strong{color:var(--lime);font-size:15px}.card-body{padding:29px 34px 32px}.prompt-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:19px}.tag{display:inline-flex;align-items:center;gap:7px;color:var(--pink);font:11px 'DM Mono',monospace;text-transform:uppercase;letter-spacing:.12em}.tag .dot{width:7px;height:7px;background:currentColor;border-radius:50%;box-shadow:0 0 12px currentColor}.streak{color:var(--muted);font:11px 'DM Mono',monospace}.clue{font-size:clamp(18px,3vw,22px);line-height:1.55;letter-spacing:-.025em;min-height:68px;margin:0 0 23px}.clue strong{color:var(--lime);font-weight:600}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice{position:relative;text-align:left;background:#222139;color:#eee;border:1px solid #393751;border-radius:12px;padding:15px 44px 15px 16px;font:500 14px 'Space Grotesk',sans-serif;cursor:pointer;transition:.16s}.choice:hover:not(:disabled){background:#2d2b49;border-color:var(--purple);transform:translateY(-2px)}.choice .letter{display:inline-grid;place-items:center;width:23px;height:23px;border:1px solid #55526d;border-radius:7px;color:#aaa7bd;font:11px 'DM Mono',monospace;margin-right:10px}.choice .arrow{position:absolute;right:15px;color:#77748f}.choice:disabled{cursor:default}.choice.correct{background:#273a2c;border-color:#85c955;color:#e7ffd7}.choice.correct .letter{background:var(--lime);border-color:var(--lime);color:#141526}.choice.wrong{background:#402839;border-color:#eb709c;color:#ffdbe8}.choice.dim{opacity:.45}.feedback{min-height:25px;margin-top:15px;font-size:13px;color:var(--muted)}.feedback.good{color:var(--lime)}.feedback.bad{color:#ff9dba}.actions{display:flex;justify-content:space-between;align-items:center;margin-top:8px}.hint-btn,.next-btn{border:0;background:transparent;color:#aaa7bd;font:12px 'DM Mono',monospace;cursor:pointer;padding:8px 0}.hint-btn:hover{color:white}.next-btn{background:var(--purple);color:#1b1830;font-weight:500;border-radius:9px;padding:11px 17px}.next-btn:hover{background:#bca7ff}.next-btn:disabled{opacity:.3;cursor:default}.bottom{max-width:700px;margin:17px auto 0;display:flex;justify-content:space-between;color:#77758e;font:10px 'DM Mono',monospace;letter-spacing:.06em}.result{text-align:center;padding:42px 25px 45px}.result .emoji{font-size:46px}.result h2{font-size:30px;letter-spacing:-.05em;margin:12px 0 5px}.result p{color:var(--muted);margin:0 0 24px}.result button{border:0;border-radius:10px;background:var(--lime);padding:12px 19px;font:600 13px 'Space Grotesk',sans-serif;cursor:pointer;color:#171729}
    @media(max-width:560px){.wrap{padding:20px 15px 40px}.top-note{font-size:9px}.hero{padding:43px 0 26px}.hero p{font-size:13px}.card-body{padding:23px 18px 24px}.game-head{padding:15px 18px}.choices{grid-template-columns:1fr}.choice{padding-top:13px;padding-bottom:13px}.clue{min-height:0}.bottom{font-size:9px}.streak{font-size:9px}}
  </style>
</head>
<body>
  <main class="wrap">
    <header class="top"><div class="brand"><span class="brand-mark">✦</span><span>nerd<span style="color:var(--purple)">verso</span></span></div><div class="top-note">um quiz pra quem sabe demais</div></header>
    <section class="hero"><div class="eyebrow">✦ desafio de cultura pop ✦</div><h1>Quem é <em>essa</em><br>lenda?</h1><p>Uma pista, quatro palpites. Quanto menos pistas, mais pontos!</p></section>
    <nav class="categories" aria-label="Categorias">
      <button class="cat active" data-cat="Todas">✦ Todas</button><button class="cat" data-cat="Anime">Anime</button><button class="cat" data-cat="Música">Música</button><button class="cat" data-cat="Séries">Séries</button><button class="cat" data-cat="Filmes">Filmes</button><button class="cat" data-cat="Mangá">Mangá</button><button class="cat" data-cat="Games">Games</button>
    </nav>
    <section class="game" id="game"></section>
    <footer class="bottom"><span>FEITO PRA FÃS, POR FÃS ✦</span><span>SEM SPOILERS (QUASE)</span></footer>
  </main>
  <script>
    const questions = [
      {c:'Anime',a:'Cowboy Bebop',h:['Acompanho um grupo de caçadores de recompensa pelo espaço.','Meu protagonista é um ex-sindicalista de terno azul, com passado na máfia.','“See you, space cowboy...”'],o:['Cowboy Bebop','Trigun','Samurai Champloo','Outlaw Star']},
      {c:'Anime',a:'A Viagem de Chihiro',h:['Uma garota entra num mundo mágico cheio de espíritos.','Seus pais são transformados em porcos numa casa de banhos.','Haku, Sem-Face e uma bruxa chamada Yubaba.'],o:['O Castelo Animado','A Viagem de Chihiro','Meu Amigo Totoro','Princesa Mononoke']},
      {c:'Anime',a:'One Piece',h:['Um bando improvável navega atrás de um tesouro lendário.','O capitão tem corpo de borracha e adora carne.','O chapéu de palha é a marca registrada do futuro Rei dos Piratas.'],o:['Fairy Tail','Dragon Ball','One Piece','Bleach']},
      {c:'Anime',a:'Neon Genesis Evangelion',h:['Adolescentes pilotam máquinas gigantes para proteger a humanidade.','A organização NERV enfrenta seres chamados Anjos.','Shinji, entre no robô.'],o:['Gurren Lagann','Code Geass','Neon Genesis Evangelion','Darling in the Franxx']},
      {c:'Música',a:'Gurenge — LiSA',h:['Essa faixa abre um anime sobre caçadores de demônios.','A voz é da cantora japonesa LiSA.','É a abertura de Demon Slayer: Kimetsu no Yaiba.'],o:['Unravel — TK','Gurenge — LiSA','Blue Bird — Ikimono-gakari','Again — YUI']},
      {c:'Música',a:'Bohemian Rhapsody — Queen',h:['Uma canção que desafia qualquer definição de gênero.','Tem ópera, hard rock e um refrão impossível de esquecer.','“Is this the real life? Is this just fantasy?”'],o:['Stairway to Heaven — Led Zeppelin','Bohemian Rhapsody — Queen','Space Oddity — David Bowie','The Show Must Go On — Queen']},
      {c:'Séries',a:'Stranger Things',h:['Uma cidade pequena, um laboratório suspeito e outra dimensão.','Um grupo de amigos encontra uma garota com poderes e um gosto por waffles.','O Mundo Invertido fica em Hawkins.'],o:['Dark','Stranger Things','The Umbrella Academy','Locke & Key']},
      {c:'Séries',a:'The Mandalorian',h:['Um caçador de recompensas cruza a galáxia com uma criança muito especial.','Acontece no universo de Star Wars, depois da queda do Império.','“This is the way.” E Grogu está junto.'],o:['Andor','The Mandalorian','Obi-Wan Kenobi','Ahsoka']},
      {c:'Filmes',a:'Matrix',h:['Um programador começa a desconfiar que a realidade não é o que parece.','Morpheus oferece uma escolha entre duas pílulas.','Neo desvia de balas em câmera lenta.'],o:['Blade Runner','Matrix','O Vingador do Futuro','Ghost in the Shell']},
      {c:'Filmes',a:'De Volta para o Futuro',h:['Um inventor excêntrico constrói uma máquina do tempo.','A viagem acontece num DeLorean turbinado.','Marty McFly precisa garantir que seus pais se apaixonem em 1955.'],o:['Bill & Ted: Uma Aventura Fantástica','De Volta para o Futuro','Feitiço do Tempo','Peggy Sue: Seu Passado a Espera']},
      {c:'Mangá',a:'Berserk',h:['Um guerreiro marcado luta num mundo medieval sombrio.','Seu enorme espadão é conhecido como Matadora de Dragões.','Guts e Griffith são figuras centrais desta obra de Kentaro Miura.'],o:['Vagabond','Claymore','Berserk','Vinland Saga']},
      {c:'Mangá',a:'Sailor Moon',h:['Uma estudante descobre que é uma guardiã com poderes mágicos.','Suas amigas também são guerreiras ligadas aos planetas.','“Em nome da Lua, vou te punir!”'],o:['Cardcaptor Sakura','Sailor Moon','Tokyo Mew Mew','Pretty Cure']},
      {c:'Games',a:'Sonic the Hedgehog',h:['Sou um herói veloz que coleciona anéis dourados.','Meu maior rival é o Dr. Eggman, que vive criando robôs.','Sou um ouriço azul famoso por correr em alta velocidade.'],o:['Crash Bandicoot','Sonic the Hedgehog','Mega Man','Rayman']},
      {c:'Games',a:'Resident Evil',h:['Uma série de terror e sobrevivência cheia de criaturas assustadoras.','A Umbrella Corporation está ligada a um perigoso vírus.','Raccoon City, zumbis e o T-Vírus fazem parte deste universo.'],o:['Silent Hill','The Last of Us','Resident Evil','Dead Space']},
      {c:'Games',a:'Fortnite',h:['Neste jogo, até 100 participantes podem disputar a vitória.','Além de lutar, dá para construir estruturas durante a partida.','A frase “só pode haver um” combina com este battle royale.'],o:['Apex Legends','Fortnite','PUBG: Battlegrounds','Overwatch']},
      {c:'Games',a:'Minecraft',h:['Um mundo de blocos onde sua imaginação define o que construir.','Dá para minerar recursos, criar itens e enfrentar um Ender Dragon.','Creepers explodem e Steve é um dos personagens mais conhecidos.'],o:['Terraria','Roblox','Minecraft','LEGO Worlds']},
      {c:'Games',a:'The Legend of Zelda',h:['Uma aventura de fantasia com masmorras, relíquias e quebra-cabeças.','Um herói chamado Link costuma partir para salvar o reino de Hyrule.','A princesa Zelda e a Triforce são pistas para esta franquia da Nintendo.'],o:['Final Fantasy','The Legend of Zelda','Fire Emblem','Chrono Trigger']},
      {c:'Games',a:'Super Mario',h:['Um encanador de bigode atravessa mundos para salvar uma princesa.','Cogumelos dão poderes e tartarugas aparecem pelo caminho.','A Nintendo, Luigi e o Reino dos Cogumelos fazem parte desta série.'],o:['Sonic the Hedgehog','Donkey Kong','Super Mario','Kirby']},
      {c:'Games',a:'God of War',h:['Um guerreiro enfrenta deuses e criaturas da mitologia.','A jornada mais recente leva pai e filho pelos reinos nórdicos.','Kratos carrega as Lâminas do Caos e chama o filho de “Boy”.'],o:['Devil May Cry','God of War','Darksiders','Hades']}
    ];
    let category='Todas', pool=[], index=0, score=0, correctCount=0, streak=0, best=Number(localStorage.getItem('nerdverso-best')||0), clue=0, locked=false;
    const game=document.querySelector('#game');
    const shuffle=a=>[...a].sort(()=>Math.random()-.5);
    function start(){pool=shuffle(questions.filter(q=>category==='Todas'||q.c===category));index=0;score=0;correctCount=0;streak=0;render()}
    function render(){
      if(index>=pool.length){game.innerHTML=`<div class="result"><div class="emoji">${correctCount===pool.length?'🏆':'🌟'}</div><h2>Mandou bem!</h2><p>Você fez <strong style="color:var(--lime)">${score}</strong> pontos e acertou ${correctCount} de ${pool.length}.</p><button id="again">Jogar de novo ↗</button></div>`;document.querySelector('#again').onclick=start;return}
      clue=0;locked=false;const q=pool[index];const opts=shuffle(q.o);const letters=['A','B','C','D'];
      game.innerHTML=`<div class="game-head"><div class="round">RODADA <b>${index+1}</b> <span style="color:#69677f">/ ${pool.length}</span></div><div class="score">✦ <strong>${score}</strong> pts</div></div><div class="card-body"><div class="prompt-row"><span class="tag"><i class="dot"></i>${q.c}</span><span class="streak">${streak>1?'🔥 '+streak+' acertos seguidos':'MELHOR: '+best}</span></div><p class="clue" id="clue">${q.h[0]}</p><div class="choices">${opts.map((o,i)=>`<button class="choice" data-answer="${o.replaceAll('&','&amp;').replaceAll('"','&quot;')}"><span class="letter">${letters[i]}</span>${o}<span class="arrow">↗</span></button>`).join('')}</div><div class="feedback" id="feedback"></div><div class="actions"><button class="hint-btn" id="hint">＋ revelar próxima pista</button><button class="next-btn" id="next" disabled>Próxima ↗</button></div></div>`;
      document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>answer(b,q));document.querySelector('#hint').onclick=nextHint;document.querySelector('#next').onclick=()=>{index++;render()};
    }
    function nextHint(){if(locked)return;const q=pool[index];if(clue<q.h.length-1){clue++;document.querySelector('#clue').textContent=q.h[clue];if(clue===q.h.length-1)document.querySelector('#hint').textContent='✦ última pista';}else document.querySelector('#feedback').textContent='Essa foi a última pista. Escolhe uma resposta!'}
    function answer(btn,q){if(locked)return;locked=true;const good=btn.dataset.answer===q.a;document.querySelectorAll('.choice').forEach(b=>{b.disabled=true;if(b.dataset.answer===q.a)b.classList.add('correct');else if(b===btn)b.classList.add('wrong');else b.classList.add('dim')});const fb=document.querySelector('#feedback');if(good){const pts=[100,70,40][Math.min(clue,2)];score+=pts;correctCount++;streak++;fb.textContent=`Acertou! +${pts} pontos — ${q.a}`;fb.className='feedback good';if(score>best){best=score;localStorage.setItem('nerdverso-best',best)}}else{streak=0;fb.textContent=`Quase! A resposta era ${q.a}.`;fb.className='feedback bad'}document.querySelector('.score strong').textContent=score;document.querySelector('.streak').textContent=streak>1?'🔥 '+streak+' acertos seguidos':'MELHOR: '+best;document.querySelector('#next').disabled=false;document.querySelector('#hint').disabled=true}
    document.querySelectorAll('.cat').forEach(b=>b.onclick=()=>{document.querySelector('.cat.active').classList.remove('active');b.classList.add('active');category=b.dataset.cat;start()});start();
    if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('./sw.js').catch(()=>{});
  </script>
</body>
</html>
